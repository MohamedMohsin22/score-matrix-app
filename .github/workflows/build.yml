name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Ensure Gradlew Exists
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Generate Dummy Keystore & Google Services
      run: |
        # إنشاء ملف debug.keystore الافتراضي المطلوب لإنهاء التوقيع
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # إنشاء ملف google-services.json وهمي لتفادي توقف البناء إذا احتاجه المترجم
        mkdir -p app/src/debug
        if [ ! -f "app/google-services.json" ]; then
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "score-matrix-dummy",
              "storage_bucket": "score-matrix.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.example.scorematrix"
                  }
                },
                "api_key": [{ "current_key": "dummy_api_key" }]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp app/google-services.json app/src/debug/google-services.json
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScoreMatrix-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
